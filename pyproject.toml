[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ai-cli"
# 版本号唯一来源：zeroai/__init__.py 的 __version__（动态读取）。
# 此前 pyproject 与 __init__ 各自硬编码，实测已发生漂移（__init__ 升到
# 1.1.4 而此处仍写 1.1.3，构建产物版本错误），故改为单点定义。
dynamic = ["version"]
description = "ZeroAI - 终端 AI 编程助手（多专家协作·语音对话·文档生成·安全审计）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ZeroAI Team" }]
keywords = ["ai", "cli", "assistant", "coding", "terminal", "zeroai"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Programming Language :: Other",  # Zig
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Security",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]

# 核心依赖（pip install 时自动安装）
dependencies = [
    "textual>=0.47",
    "openai>=1.0",
    "python-docx>=0.8",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "requests>=2.28",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "asyncssh>=2.14",
]

[project.urls]
Homepage = "https://github.com/gt17641001169-design/zero-ai"
Documentation = "https://github.com/gt17641001169-design/zero-ai#readme"
Repository = "https://github.com/gt17641001169-design/zero-ai"
Issues = "https://github.com/gt17641001169-design/zero-ai/issues"
Changelog = "https://github.com/gt17641001169-design/zero-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# 语音功能依赖（可选，体积大）
voice = [
    "sherpa-onnx>=1.9",
    "faster-whisper>=0.9",
    "av>=12.0",
]
# 开发依赖
dev = [
    "pyinstaller>=5.13",
    "build>=1.0",
]

[project.scripts]
# 安装后终端输入 zeroai 即可启动
# v1.1.3+：统一入口为 zeroai.main:main，tui_agent:main 仍保留向后兼容
zeroai = "zeroai.main:main"

[tool.setuptools]
# 包含模块
# 注意：原来这里写了 "config"，但仓库根目录并不存在 config.py
# （真正的配置在 zeroai/core/config.py）。setuptools 会容忍这个悬空声明，
# 但它纯粹是误导，已移除。
py-modules = ["tui_agent"]

[tool.setuptools.dynamic]
# 版本号从 zeroai/__init__.py 的 __version__ 读取（setuptools 优先做 AST
# 静态解析，必要时回退 import；该包 __init__ 为惰性导入，import 成本 ~0.04s）
version = { attr = "zeroai.__version__" }

[tool.setuptools.packages.find]
# zeroai-tui/ 目录名含连字符，不是合法 Python 包名，默认发现器扫不到它，
# 因此把该目录也加入 where 搜索路径，让 zeroai_tui 包能被正确安装。
#
# namespaces = false 很关键：pyproject 模式下 setuptools 默认开启命名空间包
# 发现，会把 zeroai-proxy/、zeroai-tui/ 这类"名字以 zeroai 开头"的目录
# 当成命名空间包塞进 wheel（实测确实被塞进去了）。这里关掉，并且用
# "zeroai" / "zeroai.*" 这种精确模式（注意 "zeroai-proxy" 不含点，
# 因此不会被 "zeroai.*" 匹配），确保客户端包里只有真正的代码。
where = [".", "zeroai-tui"]
include = ["zeroai", "zeroai.*", "zeroai_tui", "zeroai_tui.*"]
namespaces = false

[tool.setuptools.package-data]
# 包含图标资源
"*" = ["assets/icons/*"]
# zeroai/config.yaml 是默认配置，必须随包一起发布。
# 之前漏了这条，实测后果：全新的 pip 安装每次启动都会打印
# "Warning: Config file not found ..."，而且那行警告走的是 stdout，
# 会直接污染 --json 的单行输出契约。
"zeroai" = ["config.yaml"]
# zeroai_tui 包含 Zig 共享库和 C 源码
"zeroai_tui" = ["*.dll", "*.so", "*.dylib", "src/*.c"]

[tool.pytest.ini_options]
# pytest-asyncio 自动模式：无需 @pytest.mark.asyncio 装饰器
asyncio_mode = "auto"
# 禁用 xonsh pytest 插件（与 Windows 控制台不兼容）
addopts = "-p no:xonsh"
testpaths = ["."]
