[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ai-cli"
# 版本号唯一来源：zeroai/__init__.py 的 __version__（动态读取）。
# 此前 pyproject 与 __init__ 各自硬编码，实测已发生漂移（__init__ 升到
# 1.1.4 而此处仍写 1.1.3，构建产物版本错误），故改为单点定义。
dynamic = ["version"]
description = "ZeroAI - 终端 AI 编程助手（多专家协作·语音对话·文档生成·安全审计）"
readme = "README.md"
requires-python = ">=3.10"
# 【重要】此前为 "Proprietary"（专有），与事实矛盾：本项目 1.1.0~1.1.4 共 5 个
# 版本已实际发布于 PyPI，而专有许可证第 3.1(b) 条明文禁止"分发"。一句话总结：
# 一边在许可证里禁止分发，一边在 PyPI 上分发，这在合规审查中是最容易被抓的硬伤。
# 且"专有 + 无商用授权"直接排除了所有企业用户与二次集成方——与"要有真实用户"
# 的目标相反。现改为 Apache-2.0：允许商用与再分发，保留专利授权与免责条款，
# 不要求下游开源（对比 GPL），是 CLI 工具最无摩擦的选择。
license = { text = "Apache-2.0" }
authors = [{ name = "ZeroAI Team" }]
keywords = ["ai", "cli", "assistant", "coding", "terminal", "zeroai", "agent", "llm"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Programming Language :: Other",  # Zig
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Security",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]

# 核心依赖（pip install 时自动安装）
dependencies = [
    "textual>=0.47",
    "openai>=1.0",
    "python-docx>=0.8",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "requests>=2.28",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "asyncssh>=2.14",
]

[project.urls]
Homepage = "https://github.com/gt17641001169-design/zero-ai"
Documentation = "https://github.com/gt17641001169-design/zero-ai#readme"
Repository = "https://github.com/gt17641001169-design/zero-ai"
Issues = "https://github.com/gt17641001169-design/zero-ai/issues"
Changelog = "https://github.com/gt17641001169-design/zero-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# 语音功能依赖（可选，体积大）
voice = [
    "sherpa-onnx>=1.9",
    "faster-whisper>=0.9",
    "av>=12.0",
]
# 开发依赖
dev = [
    "pyinstaller>=5.13",
    "build>=1.0",
]

[project.scripts]
# 安装后终端输入 zeroai 即可启动
# v1.1.3+：统一入口为 zeroai.main:main，tui_agent:main 仍保留向后兼容
zeroai = "zeroai.main:main"

[tool.setuptools]
# 包含模块
#
# ---------------------------------------------------------------------------
# 关于 tui_agent.py —— 一段需要如实记录的决策历史
# ---------------------------------------------------------------------------
# （规模随解耦推进而变化，此处不写死行数：曾写「16,264 行」后即失准。
#   需要时用 `python -c "print(sum(1 for _ in open('tui_agent.py',encoding='utf-8')))"` 现查。）
#
# 1.1.4 及更早：py-modules = ["tui_agent"]
#   该文件被原样打进客户端包，占整包体积 90% 以上。
#
# 1.1.5：改为 py-modules = []
#   理由是「zeroai/tui/ 已提供模块化访问路径，tui_agent.py 只是备份」。
#   **这个理由是错的**，造成了本仓库最严重的一次回归：
#     - zeroai/tui/ 下多个文件是 `from tui_agent import ...` 的转发壳，自己不含实现；
#     - zeroai/tui/{markdown,identity}.py 转发的那批符号，在 tui_agent.py 中
#       也已经是 `from zeroai.tools.* import ...` 的转发 —— 依赖方向含
#       tui_agent.py → zeroai.* 这一向；
#     - 于是摘掉 tui_agent.py 后，`zeroai` 的**交互模式在所有平台**直接崩溃：
#         ModuleNotFoundError: No module named 'tui_agent'
#       更糟的是 zeroai/tui/app.py 确实存在于 wheel 中（文件在），
#       所以「检查文件是否存在」这种自检手段无法发现该问题，
#       必须在真实环境里执行 `from zeroai.tui.app import ZeroAI` 才能暴露。
#
# 1.1.6：恢复 py-modules = ["tui_agent"]
#   这是**有意识的技术债**，不是回到原点：1.1.4 的打包问题（体积）是成本，
#   1.1.5 的打包问题是**故障**。二者不可比，先修故障。
#
# 解除该依赖的唯一正确路径（进行中）：
#   把 tui_agent.py 中的**真实实现**逐个搬进 zeroai/tui/*.py，改完一个就把
#   对应的转发壳删掉，最后 tui_agent.py 退化为薄入口再移除。
#
#   ⚠️ 此前这里写过「app.py / widgets.py / screens.py 依赖 tui_agent.py 内部的
#      模块级状态（CURRENT_MODEL_KEY、MODEL_CONFIGS），必须先抽到 zeroai.core.*
#      才能动」—— **该判断经实测证明是错的，已作废，勿再据此排期。**
#      实测（`is` 同一性）：L9091-9204 那个 try 块会重绑定 139 个名字，因此
#      MODEL_CONFIGS / EXPERT_TEAM / WORK_MODE / CURRENT_MODEL_KEY / TOOLS / C_*
#      在 tui_agent 命名空间里**早已是 zeroai 对象本身**（非副本）：
#          MODEL_CONFIGS is zeroai.core.constants.MODEL_CONFIGS  -> True
#          WORK_MODE     is zeroai.core.constants.WORK_MODE      -> True
#     所以这些类依赖的不是「tui_agent 的状态」，而是 zeroai 的对象，
#     直接显式 import 即可，无需先抽取。
#
#   真正的阻塞点只有三类（2026-09-15 用 AST 实测）：
#     (1) 少数名字尚未存在于 zeroai.*。
#         【已完成】WORK_DIR -> core/paths.py；MessageInput -> zeroai/tui/widgets.py；
#         TOOL_USAGE_RULES / SYSTEM_PROMPT / SYSTEM_PROMPT_CORE /
#         TOOL_CAPABILITY_PROMPT -> zeroai/core/prompts.py（新建）；
#         _auto_generate_agents_md -> zeroai/core/agents_md.py（新建）。
#         `client` 仍未单独搬（它属于 _LazyClientProxy，另行处理）。
#     (2) ZeroAI 类中对全局名的**写操作**。⚠️ 旧记录写的"12 处"是错的
#         （把 global 语句数当成了名字数，又漏了 on_proxy_result）。
#         AST 实测：**7 条 global 语句 / 13 个写入点**
#           WORK_MODE×6 / _GLOBAL_STOP×4 / PROXY_CONFIG×2 / _ASR_MODEL×1
#         【已完成】全部改为 setter，两个类内 global 语句数均为 0：
#           set_work_mode()        （constants.py:512，原本就有）
#           _set_stop_flag()       （runtime.py:116，原本就有）
#           _refresh_proxy_config()（secrets.py:175，**原本就有**，此前只是没被调用）
#         注意：不需要"新增 PROXY_CONFIG 的 setter"，它早就存在。
#     (3) VoiceDialogScreen 的 `global _ASR_MODEL`。
#         【已完成】根因是识别器初始化在两处逐字重复（voice.listen_asr 与
#         _recognize），各自 global 各自模块的 _ASR_MODEL → 会各加载一份
#         约 220MB 的 SenseVoice 模型。现已收敛到 voice.get_asr_model() /
#         recognize_audio()，两处共用同一单例。
#   除上述之外，InfoBar/HintBar/MessageInput/TokenBar/AddModelScreen/SettingsScreen
#   经 AST 确认**零 global**，可直接搬。
#
#   ⇒ 结论：VoiceDialogScreen 与 ZeroAI 的搬迁阻塞均已解除，可以搬了。
#
# 若将来再次把这里改回 []，必须同时满足下面三条 —— 缺一条即复现 1.1.5 故障：
#   a) `grep -rn "from tui_agent\|import tui_agent" zeroai/` 返回空；
#   b) 全平台真实执行 `python -c "from zeroai.tui.app import ZeroAI"` 通过；
#   c) 打包后对 wheel 解压复测 (b)，而不是只看源码树。
py-modules = ["tui_agent"]

[tool.setuptools.dynamic]
# 版本号从 zeroai/__init__.py 的 __version__ 读取（setuptools 优先做 AST
# 静态解析，必要时回退 import；该包 __init__ 为惰性导入，import 成本 ~0.04s）
version = { attr = "zeroai.__version__" }

[tool.setuptools.packages.find]
# zeroai-tui/ 目录名含连字符，不是合法 Python 包名，默认发现器扫不到它，
# 因此把该目录也加入 where 搜索路径，让 zeroai_tui 包能被正确安装。
#
# namespaces = false 很关键：pyproject 模式下 setuptools 默认开启命名空间包
# 发现，会把 zeroai-proxy/、zeroai-tui/ 这类"名字以 zeroai 开头"的目录
# 当成命名空间包塞进 wheel（实测确实被塞进去了）。这里关掉，并且用
# "zeroai" / "zeroai.*" 这种精确模式（注意 "zeroai-proxy" 不含点，
# 因此不会被 "zeroai.*" 匹配），确保客户端包里只有真正的代码。
where = [".", "zeroai-tui"]
include = ["zeroai", "zeroai.*", "zeroai_tui", "zeroai_tui.*"]
namespaces = false

[tool.setuptools.package-data]
# 包含图标资源
#
# 【缺陷修复 2026-09-16】此前这里只有通配键 `"*" = ["assets/icons/*"]`。
# package-data 的值是**相对各自包目录**的 glob，而图标当时只存在于
# 仓库根的 assets/icons/，不属于任何包 —— 因此这条规则从来没有命中过任何文件。
# 实测后果：wheel 内 0 个 svg；安装后 zeroai/tui/icons.py 的
# _get_icons_dir() 解析到 <site-packages>/assets/icons（不存在），
# _load_svg_icon() 对所有图标一律返回空串 —— 即**图标功能在安装版里全程失效**。
#
# 现把图标复制一份到 zeroai/assets/icons/（包内），并显式声明，使其真正入包。
# 仓库根 assets/icons/ 予以保留：ZeroAI.spec（PyInstaller）与 icons.py 的
# frozen 分支都按该相对路径取资源，移动会破坏打包流程。
"*" = ["assets/icons/*"]
# zeroai/config.yaml 是默认配置，必须随包一起发布。
# 之前漏了这条，实测后果：全新的 pip 安装每次启动都会打印
# "Warning: Config file not found ..."，而且那行警告走的是 stdout，
# 会直接污染 --json 的单行输出契约。
#
# assets/icons/* —— 见上方缺陷修复说明（图标必须真正进入包内）。
"zeroai" = ["config.yaml", "assets/icons/*"]
# 【重要】zeroai_tui 的平台相关二进制产物（*.dll / *.pyd / *.so / *.dylib）
# 此前被声明为随包分发，但 wheel 标签是 py3-none-any（Root-Is-Purelib: true）
# —— 这是**自相矛盾**的声明：pip 在 Linux/macOS 上会照装，随后 import
# zeroai_tui 加载 win_amd64 的 .pyd 必然失败（1.1.4 实测即为该问题）。
#
# 处置：本发行版（zero-ai-cli）定位为**纯 Python 主包**，不再携带任何平台
# 二进制，标签因此真实。C 加速 TUI 作为独立发行版单独构建与发布
# （见 pyproject.accelerated.toml 的说明），由用户在明确知道自己平台时安装。
#
# 只保留 C 源码（有参考价值、平台无关、体积极小），不保留编译产物。
"zeroai_tui" = ["src/*.c"]

[tool.pytest.ini_options]
# pytest-asyncio 自动模式：无需 @pytest.mark.asyncio 装饰器
asyncio_mode = "auto"
# 禁用 xonsh pytest 插件（与 Windows 控制台不兼容）
addopts = "-p no:xonsh"
# 【重要】此前这里是 testpaths = ["."]，即从仓库根递归收集。
# 后果：测试文件被不断丢在仓库根目录（实测一度有 16 个 test_*.py 与
# pyproject.toml / README.md 平级），根目录因此变成"什么都往里放"的杂物间；
# 而且从根收集会连带扫进 build/、zero-ai-repo/ 等目录里的**同名旧副本**，
# 造成同一份测试被重复执行。
# 现收敛为下面两个明确的目录，不再从根递归。
#
# 【为什么加入 zeroai-tui/tests/】
# 此前它被排除在 testpaths 之外，需要显式指定路径才能运行，等于默认不跑。
# 实测状态（2026-09-15）：
#   - 单独运行        : 28 passed
#   - 与 tests/ 合跑  : 247 passed（219 + 28），无冲突
#   - 无 C 扩展时     : 20 passed / 8 skipped（测试自身按 HAS_C_RENDERER 跳过，不失败）
#   - 重名文件        : 无（与 tests/ 无同名 *.py）
#   - conftest 冲突   : 无（该目录下没有任何 conftest.py）
# 结论：既能跑、又不干扰，没有理由继续排除。
#
# 注意 .pyd 未被 git 跟踪（29 个跟踪文件中 0 个 .pyd），因此**新克隆的仓库
# 本来就没有 C 扩展** —— 贡献者拿到的是"20 passed / 8 skipped"这一档。
# 这是预期行为，不是故障；测试用 HAS_C_RENDERER 分支而非硬断言。
testpaths = ["tests", "zeroai-tui/tests"]
