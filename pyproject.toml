[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ai-cli"
# 版本号唯一来源：zeroai/__init__.py 的 __version__（动态读取）。
# 此前 pyproject 与 __init__ 各自硬编码，实测已发生漂移（__init__ 升到
# 1.1.4 而此处仍写 1.1.3，构建产物版本错误），故改为单点定义。
dynamic = ["version"]
description = "ZeroAI - 终端 AI 编程助手（多专家协作·语音对话·文档生成·安全审计）"
readme = "README.md"
requires-python = ">=3.10"
# 【重要】此前为 "Proprietary"（专有），与事实矛盾：本项目 1.1.0~1.1.4 共 5 个
# 版本已实际发布于 PyPI，而专有许可证第 3.1(b) 条明文禁止"分发"。一句话总结：
# 一边在许可证里禁止分发，一边在 PyPI 上分发，这在合规审查中是最容易被抓的硬伤。
# 且"专有 + 无商用授权"直接排除了所有企业用户与二次集成方——与"要有真实用户"
# 的目标相反。现改为 Apache-2.0：允许商用与再分发，保留专利授权与免责条款，
# 不要求下游开源（对比 GPL），是 CLI 工具最无摩擦的选择。
license = { text = "Apache-2.0" }
authors = [{ name = "ZeroAI Team" }]
keywords = ["ai", "cli", "assistant", "coding", "terminal", "zeroai", "agent", "llm"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # 【2026-10-10】移除 "Programming Language :: C" 与 "Other # Zig"：
    # 那两条是为 zeroai-tui（自研 C/Zig 渲染层）打的标签。zeroai/ 目录
    # 实测 90 个文件 / 44,117 行**全部是 Python，0 个 .c/.zig**，且 wheel
    # 标签为 py3-none-any（0 二进制产物）—— 继续挂着 C/Zig 属虚报。
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Security",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]

# 核心依赖（pip install 时自动安装）
# 2026-10-08 依赖审计（evals/results/imports.md）：只把「未被 try/except 保护、
# 且位于模块顶层」的第三方 import 放进主依赖 —— 这类缺失会直接 ImportError。
# 已保护的可选功能一律走 [project.optional-dependencies]，按功能分组。
dependencies = [
    "textual>=0.47",
    # rich：tools/render.py 与 tui/*.py 共 12 处顶层裸 import，无保护。
    # 此前仅靠 textual 传递安装，属隐式依赖，现显式声明。
    "rich>=13.0",
    "openai>=1.0",
    "python-docx>=0.8",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    # requests：实测全仓 0 处 import（见 evals/results/imports.md「已声明但未
    # 被 import」）。暂保留以免下游用户脚本依赖断裂，待确认后单独移除。
    "requests>=2.28",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "asyncssh>=2.14",
]

[project.urls]
Homepage = "https://github.com/Toni-cs/zero-ai"
Documentation = "https://github.com/Toni-cs/zero-ai#readme"
Repository = "https://github.com/Toni-cs/zero-ai"
Issues = "https://github.com/Toni-cs/zero-ai/issues"
Changelog = "https://github.com/Toni-cs/zero-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# 语音功能依赖（可选，体积大）
# 2026-10-08 审计补入：tools/voice.py 与 tui/screens.py 中 pygame /
# sounddevice / edge_tts 均已用 try/except 保护，故归入本组而非主依赖。
voice = [
    "sherpa-onnx>=1.9",
    "faster-whisper>=0.9",
    "av>=12.0",
    "pygame>=2.1",
    "sounddevice>=0.4",
    "edge-tts>=6.1",
]
# MCP 客户端/服务端（zeroai/mcp/client.py 的 httpx、server.py 的
# starlette+uvicorn 均有 try/except 保护，缺失时 MCP 功能降级而非崩溃）
mcp = [
    "httpx>=0.24",
    "starlette>=0.27",
    "uvicorn>=0.23",
]
# 向量记忆与文件监视（memory/vector_store.py 的 faiss、
# memory/file_watcher.py 的 watchdog 均有保护）
vector = [
    "faiss-cpu>=1.7",
    "watchdog>=3.0",
]
# 文件操作增强（tools/file_manager.py 的 send2trash，有保护）
files = [
    "send2trash>=1.8",
]
# 桌面窗口管理（tools/window_mgr.py 的 uiautomation，Windows 专用，有保护）
desktop = [
    "uiautomation>=2.0",
]
# 开发依赖
dev = [
    "pyinstaller>=5.13",
    "build>=1.0",
    # ruff：写文件后的自动格式化（zeroai/core/formatters.py）。
    # **故意不进主依赖** —— 它是子进程工具而非 import，缺失时该功能
    # 按设计优雅降级（"检测不到就跳过"），不会 ImportError。
    # 装了才生效，符合本文件"可选功能走 extra"的既定原则。
    "ruff>=0.5",
]
# 一键全装：显式列出全部可选包，不使用自引用 extra
# （self-referencing extra 对未发布版本号不稳）
all = [
    "sherpa-onnx>=1.9",
    "faster-whisper>=0.9",
    "av>=12.0",
    "pygame>=2.1",
    "sounddevice>=0.4",
    "edge-tts>=6.1",
    "httpx>=0.24",
    "starlette>=0.27",
    "uvicorn>=0.23",
    "faiss-cpu>=1.7",
    "watchdog>=3.0",
    "send2trash>=1.8",
    "uiautomation>=2.0",
]

[project.scripts]
# 安装后终端输入 zeroai 即可启动
# v1.1.3+：统一入口为 zeroai.main:main（曾同时保留 tui_agent:main 向后兼容，
#          该文件已于 2026-10-06 删除，见下方 [tool.setuptools] 注释）
zeroai = "zeroai.main:main"

[tool.setuptools]
# 包含模块
#
# ---------------------------------------------------------------------------
# 关于 tui_agent.py —— 一段需要如实记录的决策历史（终章）
# ---------------------------------------------------------------------------
# 规模不写死行数：曾写「16,264 行」后即失准。历史值以 git 为准。
#
# 1.1.4 及更早：py-modules = ["tui_agent"]
#   该文件被原样打进客户端包，占整包体积 90% 以上。
#
# 1.1.5：改为 py-modules = []
#   理由是「zeroai/tui/ 已提供模块化访问路径，tui_agent.py 只是备份」。
#   **这个理由是错的**，造成了本仓库最严重的一次回归：
#     - zeroai/tui/ 下多个文件是 `from tui_agent import ...` 的转发壳，自己不含实现；
#     - 摘掉 tui_agent.py 后，`zeroai` 的**交互模式在所有平台**直接崩溃：
#         ModuleNotFoundError: No module named 'tui_agent'
#   更糟的是 zeroai/tui/app.py 确实存在于 wheel 中（文件在），
#   所以「检查文件是否存在」这种自检手段无法发现该问题。
#
# 1.1.6：恢复 py-modules = ["tui_agent"]
#   这是**有意识的技术债**，不是回到原点：1.1.4 的打包问题（体积）是成本，
#   1.1.5 的打包问题是**故障**。二者不可比，先修故障。
#
# 2026-10-06：py-modules = []（本次），tui_agent.py 从源码树**彻底删除**
#   与 1.1.5 的区别在于：这次是真的解耦完了，不是"以为解耦完了"。三条退出
#   条件（1.1.6 时在此自订，缺一条即复现 1.1.5 故障）逐条实测：
#     a) 代码依赖归零 —— 不再是 grep 文案（那会命中注释里的迁移史料），
#        改用 tests/test_ghost_names_regression.py 的 AST 判定：
#        zeroai/ 内不存在任何 `import tui_agent` / `from tui_agent import`
#        **语句**（模块级与函数级都扫）。该测试此前给 main.py 留了白名单
#        （过渡期回退分支），本次一并摘除，现在全仓库无白名单。
#        实现侧同步删除：zeroai/main.py 的 `if _missing == "tui_agent"`
#        回退分支 —— 它不再 import，只对"残留旧代码的 wheel"给出可读报错。
#     b) 全平台真实执行 `python -c "from zeroai.tui.app import ZeroAI"` 通过；
#     c) 打包后对 wheel 解压复测 (b)，而不是只看源码树。
#   删除前的实证（防"删了才发现有人用"）：
#     - 10,017 行中 109 个顶层定义（5,688 行）被 zeroai/ 同名定义遮蔽，
#       43/44 个"存活"函数在 zeroai/ 也有同名定义，真正独有的只有
#       _LazyClientProxy（19 行，其职责已由 zeroai.core.secrets 承担）；
#     - 隐藏该文件跑全量测试：16 项失败/错误**全部**是它自己的自测，
#       生产代码零破损；
#     - [project.scripts] 只有 zeroai，从未有过 tui_agent 控制台脚本。
#   结论：该文件 99.9% 是与 zeroai/ 重复的第二份实现，保留它只会让
#   "改哪一份"变成长期疑问。需要历史版本时用 git show <rev>:tui_agent.py。
py-modules = []

[tool.setuptools.dynamic]
# 版本号从 zeroai/__init__.py 的 __version__ 读取（setuptools 优先做 AST
# 静态解析，必要时回退 import；该包 __init__ 为惰性导入，import 成本 ~0.04s）
version = { attr = "zeroai.__version__" }

[tool.setuptools.packages.find]
# namespaces = false 很关键：pyproject 模式下 setuptools 默认开启命名空间包
# 发现，会把 zeroai-proxy/ 这类"名字以 zeroai 开头但没有 __init__.py"的
# 目录当成命名空间包塞进 wheel（1.1.6 实测确实被塞进去了）。这里关掉，
# 并且用 "zeroai" / "zeroai.*" 这种精确模式（注意 "zeroai-proxy" 不含点，
# 因此不会被 "zeroai.*" 匹配），确保客户端包里只有真正的代码。
#
# 【历史】2026-10-10 移除 zeroai-tui/（自研 C/Zig 渲染层）后，这里原本的
# where = [".", "zeroai-tui"] 与 include 中的 zeroai_tui* 一并删除。
# 此前 wheel 里确实装着 13 个 zeroai_tui/*.py + src/，而它的二进制产物
# 装不上（见下方 package-data 的历史说明），属于装了也跑不动的死代码。
include = ["zeroai", "zeroai.*"]
namespaces = false

[tool.setuptools.package-data]
# 包含图标资源
#
# 【缺陷修复 2026-09-16】此前这里只有通配键 `"*" = ["assets/icons/*"]`。
# package-data 的值是**相对各自包目录**的 glob，而图标当时只存在于
# 仓库根的 assets/icons/，不属于任何包 —— 因此这条规则从来没有命中过任何文件。
# 实测后果：wheel 内 0 个 svg；安装后 zeroai/tui/icons.py 的
# _get_icons_dir() 解析到 <site-packages>/assets/icons（不存在），
# _load_svg_icon() 对所有图标一律返回空串 —— 即**图标功能在安装版里全程失效**。
#
# 现把图标复制一份到 zeroai/assets/icons/（包内），并显式声明，使其真正入包。
# 仓库根 assets/icons/ 予以保留：ZeroAI.spec（PyInstaller）与 icons.py 的
# frozen 分支都按该相对路径取资源，移动会破坏打包流程。
"*" = ["assets/icons/*"]
# zeroai/config.yaml 是默认配置，必须随包一起发布。
# 之前漏了这条，实测后果：全新的 pip 安装每次启动都会打印
# "Warning: Config file not found ..."，而且那行警告走的是 stdout，
# 会直接污染 --json 的单行输出契约。
#
# assets/icons/* —— 见上方缺陷修复说明（图标必须真正进入包内）。
"zeroai" = ["config.yaml", "assets/icons/*", "skills/*.md"]
# skills/*.md —— 技能（Skills）系统的内置技能。缺这条的话，源码树里
# `skill_list` 能看到技能，但 pip 安装版一个都没有：**与图标当年
# "glob 从未命中"是同一类故障**（源码树正常、安装版静默失效）。
# 声明后须以"解包 wheel 复测"验证，不能只看源码树。
# 【历史】2026-10-10 删除 zeroai_tui（自研 C/Zig 渲染层）后，此键一并移除。
# 此前它声明 "zeroai_tui" = ["src/*.c"]，但 1.1.4 实测出过自相矛盾：
# wheel 标签是 py3-none-any（Root-Is-Purelib: true），却要分发 win_amd64 的
# .pyd —— pip 在 Linux/macOS 上照装，import 随即失败。
# 现定位明确：zero-ai-cli 是**纯 Python 主包**，不携带任何平台二进制。

[tool.pytest.ini_options]
# pytest-asyncio 自动模式：无需 @pytest.mark.asyncio 装饰器
asyncio_mode = "auto"
# 禁用 xonsh pytest 插件（与 Windows 控制台不兼容）
addopts = "-p no:xonsh"
# 【重要】此前这里是 testpaths = ["."]，即从仓库根递归收集。
# 后果：测试文件被不断丢在仓库根目录（实测一度有 16 个 test_*.py 与
# pyproject.toml / README.md 平级），根目录因此变成"什么都往里放"的杂物间；
# 而且从根收集会连带扫进 build/、zero-ai-repo/ 等目录里的**同名旧副本**，
# 造成同一份测试被重复执行。
# 现收敛为单个明确目录，不再从根递归。
#
# 【历史】2026-10-10 删除 zeroai-tui/ 后，testpaths 里的 "zeroai-tui/tests"
# 一并移除（原先为 28 个渲染/Zig 测试）。本目录现为测试唯一入口。
testpaths = ["tests"]
