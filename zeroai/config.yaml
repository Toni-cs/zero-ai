# ZeroAI Configuration File
# This file contains all configurable settings for ZeroAI

# ====== Model Configurations ======
models:
  glm:
    label: "智谱GLM"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: ""  # Will be loaded from environment or config
    model: "glm-4.7-flash"
  
  glm-4:
    label: "智谱GLM-4"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: ""  # Will be loaded from environment or config
    model: "glm-4-flash"
  
  glm-v:
    label: "智谱GLM-4V"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    api_key: ""  # Will be loaded from environment or config
    model: "glm-4v-flash"
  
  openrouter:
    label: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""  # Will be loaded from environment or config
    model: "openrouter/free"
  
  ollama:
    label: "Ollama本地"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    model: "gemma4:latest"

# ====== Hybrid Mode Configuration ======
hybrid:
  max_parallel_experts: 3
  expert_max_chars: 800
  dedup_similarity_threshold: 0.7
  memory_turns: 3
  enable_collab_chain: false

# ====== Tool Configuration ======
tools:
  max_result_length: 8000
  timeout: 120
  python_sandbox_timeout: 10

# ====== TUI Configuration ======
tui:
  theme: "dark"
  font_size: 14
  show_toolbar: true
  auto_scroll: true

# ====== Security Configuration ======
security:
  allowed_commands:
    - "dir"
    - "ls"
    - "pwd"
    - "echo"
    - "cat"
    - "type"
    - "find"
    - "grep"
  blocked_commands:
    - "format"
    - "del /f"
    - "shutdown"
    - "mkfs"
    - "rm -rf /"
  max_output_length: 8000
